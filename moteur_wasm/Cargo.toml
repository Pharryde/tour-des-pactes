[package]
name = "moteur_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Optimisation de taille du .wasm livré. Elle compense l'absence de `wasm-opt` : celui-ci n'arrive
# qu'avec wasm-pack, dont le binaire téléchargé est bloqué par Smart App Control sur cette machine
# (voir CLAUDE.md). Sans ces réglages, le binaire passe de ~138 Ko à ~199 Ko.
# `panic` est volontairement laissé à sa valeur par défaut : passer à "abort" ferait perdre les
# messages de panique, que CombatArene remonte en console pour diagnostiquer un tour cassé.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dependencies]
wasm-bindgen = "0.2.84"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
rand = { version = "0.8", features = ["std"] }
getrandom = { version = "0.2", features = ["js"] } # LA NOUVELLE LIGNE EST ICI