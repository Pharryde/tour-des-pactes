[package]
name = "moteur_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
rand = { version = "0.8", features = ["std"] }
getrandom = { version = "0.2", features = ["js"] } # LA NOUVELLE LIGNE EST ICI